services:
  react:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: react
    container_name: react
    ports:
      - 3000:3000
    volumes:
      - ./workspace:/workspace
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  react-native:
    build:
      context: .
      dockerfile: ./Dockerfile.react-native
    image: react-native
    container_name: react-native
    ports:
      - 8081:8081
    volumes:
      - ./workspace:/workspace
    tty: true
